# Releases the version in pyproject.toml on every surface, in this order: the gate; the Hub
# tag the package pins, set on the signed model commit after every variant verifies; PyPI by
# trusted publishing with attestations; the runtime images, pushed and signed; the MCP
# Registry entry; the docs site; the GitHub release. Run from main by the operator, with the
# commit sign-model reported.
name: release

on:
  workflow_dispatch:
    inputs:
      model_commit:
        description: Full commit id of the signed Hub revision this version pins
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MODEL_COMMIT: ${{ inputs.model_commit }}
  UV: uv run --locked --no-default-groups --extra local

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    uses: $/.github/workflows/check.yml

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Read the version and refuse one already released
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "$(jq -r .version server.json)" = "$version"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "v$version is already released" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  model:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    environment: hub
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Verify every variant of the signed commit as the package loads it
        run: |
          $UV hf download vathosai/mimir-1 config.json --revision "$MODEL_COMMIT" --local-dir model
          for variant in $(jq -r '.variants | keys[]' model/config.json); do
            $UV mimir download --revision "$MODEL_COMMIT" --variant "$variant" --device cpu
          done
      - name: Tag the revision the package pins
        run: $UV python tools/hub.py tag --revision "$MODEL_COMMIT"

  pypi:
    needs: [build, model]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mimirai/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  images:
    needs: [build, model]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [cpu, cuda]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build, push and sign
        env:
          IMAGE: ghcr.io/vathosai/mimir:${{ needs.build.outputs.version }}-${{ matrix.variant }}
          VARIANT: ${{ matrix.variant }}
        run: |
          make image VARIANT="$VARIANT"
          docker push "$IMAGE"
          cosign sign --yes "$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"

  registry:
    needs: [pypi, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  docs:
    needs: [pypi]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: make docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  github:
    needs: [build, registry, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Tag the release and attach the distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading {found = 1; next} /^## / {found = 0} found' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\nModel: vathosai/mimir-1 at %s.\n' "$MODEL_COMMIT" >> notes.md
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "mimirai $VERSION" --notes-file notes.md
