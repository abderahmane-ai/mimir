---
name: Feature request
description: Propose a new capability or a change to existing behaviour.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please open one request per feature so each can be discussed and tracked independently.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API sketches or examples if helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about, and why you prefer the proposal.

  - type: checkboxes
    id: willing-to-contribute
    attributes:
      label: Are you willing to submit a pull request?
      options:
        - label: Yes, I'd like to implement this myself.
